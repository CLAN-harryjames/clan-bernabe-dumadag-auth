<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password - CLAN Bernabe Dumadag</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #18345c, #081426 65%);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      max-width: 430px;
      width: 100%;
      background: rgba(17, 31, 53, 0.96);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .brand {
      text-align: center;
      color: #f6c453;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }

    p {
      color: #cbd5e1;
      line-height: 1.5;
      text-align: center;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #e5e7eb;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.16);
      background: #0b1729;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #f6c453;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #f6c453;
      color: #081426;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      display: none;
      line-height: 1.4;
      font-size: 14px;
    }

    .success {
      display: block;
      background: rgba(34,197,94,.16);
      border: 1px solid rgba(34,197,94,.35);
      color: #bbf7d0;
    }

    .error {
      display: block;
      background: rgba(239,68,68,.16);
      border: 1px solid rgba(239,68,68,.35);
      color: #fecaca;
    }

    .info {
      display: block;
      background: rgba(59,130,246,.16);
      border: 1px solid rgba(59,130,246,.35);
      color: #bfdbfe;
    }

    .small {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">CLAN Bernabe Dumadag</div>

    <h1>Reset Password</h1>

    <p>
      Enter your new password below.
    </p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="6" autocomplete="new-password" required />

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required />

      <button id="submitButton" type="submit">Update Password</button>
    </form>

    <div id="message" class="message"></div>

    <p class="small">
      After your password is updated, return to the CLAN Bernabe Dumadag mobile app and log in again.
    </p>
  </main>

  <script>
    const SUPABASE_URL = "https://mzgltpulauqrbgimdmgy.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16Z2x0cHVsYXVxcmJnaW1kbWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MDI4NzIsImV4cCI6MjA4OTk3ODg3Mn0.XSzto7izrClNPnS-w2P_ByVaMFVwLze-_Fr71mreY4A";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true
      }
    });

    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function getUrlParameter(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    async function initializeRecoverySession() {
      showMessage("Checking reset link...", "info");

      try {
        const code = getUrlParameter("code");

        if (code) {
          const result = await client.auth.exchangeCodeForSession(code);

          if (result.error) {
            showMessage(
              "Reset link error: " + result.error.message + ". Please request a new password reset email.",
              "error"
            );
            return;
          }
        }

        const sessionResult = await client.auth.getSession();

        if (sessionResult.error) {
          showMessage(
            "Session error: " + sessionResult.error.message,
            "error"
          );
          return;
        }

        if (!sessionResult.data.session) {
          showMessage(
            "This reset link is invalid or expired. Please request a new password reset email from the mobile app.",
            "error"
          );
          return;
        }

        showMessage("Reset link verified. You can now enter your new password.", "success");
      } catch (error) {
        showMessage(
          "Something went wrong while checking the reset link. Please request a new password reset email.",
          "error"
        );
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = passwordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Updating...";

      try {
        const result = await client.auth.updateUser({
          password: password
        });

        submitButton.disabled = false;
        submitButton.textContent = "Update Password";

        if (result.error) {
          showMessage(
            "Could not update password: " + result.error.message,
            "error"
          );
          return;
        }

        showMessage(
          "Password updated successfully. You can now return to the CLAN Bernabe Dumadag mobile app and log in.",
          "success"
        );

        form.reset();

        await client.auth.signOut();
      } catch (error) {
        submitButton.disabled = false;
        submitButton.textContent = "Update Password";

        showMessage(
          "Could not update password. Please try again or request a new reset email.",
          "error"
        );
      }
    });

    initializeRecoverySession();
  </script>
</body>
</html>
